x="88" y="156" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">Gasfitería rápida y detección de fugas</text><g id="Etiqueta / Completado"><rect x="88" y="162" width="74.80000000000001" height="20" rx="10" fill="#E8F8F0"/><text x="125.4" y="176" font-family="Inter, sans-serif" font-size="10.5" font-weight="700" fill="#2E9D72" text-anchor="middle">Completado</text></g></g><text x="195" y="236" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#252B3A" text-anchor="middle">¿Cómo fue tu experiencia?</text><g id="Selector estrellas"><g id="icon-star" transform="translate(70,256) scale(1.6667)" fill="#F59E0B" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></g><g id="icon-star" transform="translate(120,256) scale(1.6667)" fill="#F59E0B" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></g><g id="icon-star" transform="translate(170,256) scale(1.6667)" fill="#F59E0B" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></g><g id="icon-star" transform="translate(220,256) scale(1.6667)" fill="#F59E0B" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></g><g id="icon-star" transform="translate(270,256) scale(1.6667)" fill="none" stroke="#D1D5DB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></g></g><text x="195" y="320" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#F59E0B" text-anchor="middle">Muy bueno</text><text x="20" y="352" font-family="Inter, sans-serif" font-size="12.5" font-weight="700" fill="#4B5563" text-anchor="start">Comentario (opcional)</text><g id="Comentario"><rect x="20" y="360" width="350" height="100" rx="10" fill="#fff" stroke="#D1D5DB" stroke-width="1"/><text x="34" y="384" font-family="Inter, sans-serif" font-size="13" font-weight="400" fill="#252B3A" text-anchor="start">Llegó puntual y resolvió la fuga el mismo</text><text x="34" y="402" font-family="Inter, sans-serif" font-size="13" font-weight="400" fill="#252B3A" text-anchor="start">día. Dejó todo limpio.</text></g><g id="Confirmación"><rect x="20" y="480" width="350" height="52" rx="10" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/><rect x="34" y="496" width="20" height="20" rx="6" fill="#D83B35"/><g id="icon-check" transform="translate(37,499) scale(0.5833)" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></g><text x="66" y="509" font-family="Inter, sans-serif" font-size="12.5" font-weight="600" fill="#252B3A" text-anchor="start">Confirmo que el servicio fue realizado</text></g><text x="20" y="560" font-family="Inter, sans-serif" font-size="11" font-weight="400" fill="#6B7280" text-anchor="start">Solo puedes calificar una vez por contratación. Las reseñas</text><text x="20" y="576" font-family="Inter, sans-serif" font-size="11" font-weight="400" fill="#6B7280" text-anchor="start">pueden ser revisadas por moderación.</text><g id="Botón / Enviar calificación"><rect x="20" y="612" width="350" height="50" rx="25.0" fill="#D83B35" filter="url(#sh)"/><text x="195.0" y="642.25" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Enviar calificación</text></g></g></svg>